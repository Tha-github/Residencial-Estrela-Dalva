<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Painel · Residencial Estrela Dalva</title><link rel="stylesheet" href="/admin/admin.css"></head>
<body><main><header><p class="eyebrow">Residencial Estrela Dalva</p><h1>Painel de conteúdo</h1><p>Edite as informações e confirme antes de publicar. A publicação pode levar alguns minutos.</p><button id="logout" type="button">Sair</button></header>
<div id="status" role="status" aria-live="polite">Verificando sessão…</div><form id="editor" hidden>
<section><h2>Textos</h2><label>Título do hero <input name="hero.title" maxlength="120"></label><label>Subtítulo do hero <input name="hero.subtitle" maxlength="240"></label><label>Título da apresentação <input name="about.title" maxlength="120"></label><label>Parágrafos da apresentação <textarea name="about.paragraphs" rows="6" aria-describedby="json-help"></textarea></label><label>Diferenciais (JSON; mantenha os itens existentes) <textarea name="highlights" rows="8" aria-describedby="json-help"></textarea></label><label>Regras e comodidades (JSON) <textarea name="practical.lists" rows="8" aria-describedby="json-help"></textarea></label><p id="json-help">Textos simples, sem HTML. Os campos estruturais são preservados pelo servidor.</p></section>
<section><h2>Informações práticas</h2><label>Hóspedes <input name="practical.maxGuests" type="number" min="0" max="30"></label><label>Quartos <input name="practical.bedrooms" type="number" min="0" max="20"></label><label>Camas <input name="practical.beds" type="number" min="0" max="40"></label><label>Banheiros <input name="practical.bathrooms" type="number" min="0" max="20"></label><label>Área em m² <input name="practical.areaM2" type="number" min="0" max="2000" step="0.1"></label><label>Check-in <input name="practical.checkIn" type="time"></label><label>Check-out <input name="practical.checkOut" type="time"></label></section>
<section><h2>Links e contato</h2><label>Google Maps <input name="location.mapsUrl" type="url"></label><label>Booking.com <input name="booking.booking" type="url"></label><label>Airbnb <input name="booking.airbnb" type="url"></label><label>Decolar <input name="booking.decolar" type="url"></label><label>Instagram <input name="contact.instagram" type="url"></label><label>WhatsApp (DDI + DDD + número) <input name="contact.whatsapp" inputmode="numeric" maxlength="13"></label><label>E-mail <input name="contact.email" type="email" maxlength="254"></label></section>
<section><h2>Fotos</h2><label>Imagem do hero <input id="hero-file" type="file" accept="image/jpeg,image/png,image/webp"></label><div id="hero-preview"></div><label>Adicionar à galeria <input id="gallery-file" type="file" accept="image/jpeg,image/png,image/webp" multiple></label><div id="gallery"></div></section>
<button class="save" type="submit">Revisar e salvar</button></form></main><script type="module" src="/admin/admin.js"></script></body></html>
